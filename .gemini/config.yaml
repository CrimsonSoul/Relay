# Gemini Code Assist for GitHub: advisory AI review on every pull request.
have_fun: false
code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
ignore_patterns:
  - package-lock.json
  - 'coverage/**'
  - 'dist/**'
  - 'out/**'
