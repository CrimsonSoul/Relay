name: Retry failed main release

# A flaky check on main otherwise blocks that commit's release until someone reruns it. A failed
# first Release attempt gets one automatic retry; workflow_run always runs this file from the
# default branch, never from a pull request.
on:
  workflow_run:
    workflows:
      - Build and Release
    types:
      - completed
    branches:
      - main

permissions:
  actions: write
  contents: read

concurrency:
  group: relay-main-retry-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  retry:
    name: Retry failed main release once
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Rerun failed jobs once
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { runMainRetry } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/main-retry.mjs`
            );
            await runMainRetry({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              release: context.payload.workflow_run,
              log: core.info,
            });
