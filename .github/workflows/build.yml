name: Build and Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

# Rapid pushes to the same branch cancel superseded runs instead of queueing.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache ESLint results
        continue-on-error: true
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/eslint
          key: eslint-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ hashFiles('package-lock.json', 'eslint.config.js', 'tsconfig.json', 'tsconfig.node.json', 'tsconfig.renderer.json') }}-${{ github.sha }}
          restore-keys: eslint-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ hashFiles('package-lock.json', 'eslint.config.js', 'tsconfig.json', 'tsconfig.node.json', 'tsconfig.renderer.json') }}-

      - name: Cache Prettier results
        continue-on-error: true
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/prettier
          key: prettier-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ hashFiles('package-lock.json', '.prettierrc', '.prettierignore') }}-${{ github.sha }}
          restore-keys: prettier-${{ runner.os }}-node-${{ hashFiles('.node-version') }}-${{ hashFiles('package-lock.json', '.prettierrc', '.prettierignore') }}-

      - name: Install dependencies
        env:
          RELAY_SKIP_POCKETBASE_DOWNLOAD: '1'
        run: npm ci --prefer-offline

      - name: Static checks (typecheck + lint + format, parallel)
        run: |
          npm run typecheck & TYPECHECK=$!
          npm run lint & LINT=$!
          npm run format:check & FORMAT=$!
          npm audit --audit-level=high --omit=dev & AUDIT=$!
          wait $TYPECHECK && wait $LINT && wait $FORMAT && wait $AUDIT

      - name: Build production bundles
        run: npm run build

  unit-coverage:
    name: Unit coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        env:
          RELAY_SKIP_POCKETBASE_DOWNLOAD: '1'
        run: npm ci --prefer-offline

      - name: Generate unit coverage
        run: npm run test:coverage -- --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 --coverage.thresholds.statements=0

      - name: Run cache integration tests
        run: npm run test:cache

      - name: Upload unit coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-coverage
          path: coverage/unit/lcov.info
          if-no-files-found: error
          retention-days: 1

  renderer-coverage:
    name: Renderer coverage (${{ matrix.shard-index }}/${{ matrix.shard-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    strategy:
      fail-fast: false
      matrix:
        shard-index: [1, 2, 3, 4]
        shard-total: [4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        env:
          RELAY_SKIP_POCKETBASE_DOWNLOAD: '1'
        run: npm ci --prefer-offline

      - name: Generate renderer coverage shard
        run: npm run test:renderer -- --coverage --reporter=dot --reporter=blob --shard=${{ matrix.shard-index }}/${{ matrix.shard-total }} --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 --coverage.thresholds.statements=0

      - name: Upload renderer coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: renderer-coverage-${{ matrix.shard-index }}
          path: .vitest/blob/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  # Windows is Relay's primary platform; its main-process and script suites run on every PR.
  windows-unit:
    name: Windows unit tests
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        env:
          RELAY_SKIP_POCKETBASE_DOWNLOAD: '1'
        run: npm ci --prefer-offline

      - name: Run unit tests
        run: npm run test:unit

      - name: Run cache integration tests
        run: npm run test:cache

  workflow-tests:
    name: Integration workflows (${{ matrix.suite }} ${{ matrix.shard-index }}/${{ matrix.shard-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: electron
            shard-index: 1
            shard-total: 4
          - suite: electron
            shard-index: 2
            shard-total: 4
          - suite: electron
            shard-index: 3
            shard-total: 4
          - suite: electron
            shard-index: 4
            shard-total: 4
          - suite: web
            shard-index: 1
            shard-total: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Verify PocketBase replay against real storage
        if: matrix.suite == 'web'
        run: npm run test:pocketbase -- verification/offline-replay-real-pb.test.ts verification/dynatrace-pipeline.test.ts

      # The Azure apt mirror intermittently stalls for minutes on large font/mesa
      # packages. Seeding apt's archive from cache skips those downloads; apt
      # still verifies every .deb against the signed index and fetches anything
      # missing or outdated.
      - name: Resolve apt cache key
        id: apt-key
        shell: bash
        run: |
          prefix="apt-debs-${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS:-unknown}-${ImageVersion:-unknown}-${{ matrix.suite }}"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"

      - name: Restore cached apt packages
        id: apt-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/relay-apt
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: ${{ steps.apt-key.outputs.prefix }}-

      - name: Seed apt archive
        shell: bash
        run: |
          if compgen -G "$HOME/.cache/relay-apt/*.deb" > /dev/null; then
            sudo cp "$HOME"/.cache/relay-apt/*.deb /var/cache/apt/archives/
          fi

      - name: Install Playwright browsers and Linux dependencies
        if: matrix.suite == 'web'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Electron Linux dependencies
        if: matrix.suite == 'electron'
        run: npx playwright install-deps chromium

      - name: Collect apt packages for cache
        if: matrix.shard-index == 1 && steps.apt-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          rm -rf "$HOME/.cache/relay-apt"
          mkdir -p "$HOME/.cache/relay-apt"
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t "$HOME/.cache/relay-apt" {} +
          echo "Cached apt packages: $(find "$HOME/.cache/relay-apt" -name '*.deb' | wc -l)"

      - name: Save apt packages
        if: matrix.shard-index == 1 && steps.apt-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/relay-apt
          key: ${{ steps.apt-key.outputs.key }}

      # Isolated runners avoid concurrent native rebuilds. Keep one worker per
      # shard; duration estimates only assign tests, never select the test inventory.
      - name: Run Electron workflows
        if: matrix.suite == 'electron'
        run: |
          sudo apt-get install --yes dbus-x11 gnome-keyring
          dbus-run-session -- bash -euo pipefail -c '
            openssl rand -hex 32 | gnome-keyring-daemon --unlock --components=secrets
            xvfb-run --auto-servernum npm run test:electron -- --fully-parallel --workers=1 --balanced-shard=${{ matrix.shard-index }}/${{ matrix.shard-total }}
          '

      - name: Run browser workflows
        if: matrix.suite == 'web'
        run: xvfb-run --auto-servernum npm run test:web

      - name: Upload workflow failure details
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workflow-test-failures-${{ matrix.suite }}-${{ matrix.shard-index }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 1

  sonarqube:
    name: SonarQube quality gate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify exact checked-out commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Sonar packages
        continue-on-error: true
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: sonar-${{ runner.os }}-

      - name: Install dependencies
        env:
          RELAY_SKIP_POCKETBASE_DOWNLOAD: '1'
        run: npm ci --prefer-offline

      - name: Install verified SonarScanner CLI
        shell: bash
        run: |
          archive="$RUNNER_TEMP/sonar-scanner.zip"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --retry 3 --max-time 120 \
            --output "$archive" \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.1.0.6389-linux-x64.zip
          printf '%s  %s\n' bb8f709f9cb73352f8d1260a3b3c506c0f41146754bc630762c126d795499d0b "$archive" | shasum -a 256 -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/relay-sonar-scanner"
          echo "$RUNNER_TEMP/relay-sonar-scanner/sonar-scanner-8.1.0.6389-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Wait for successful coverage
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/wait-for-coverage.mjs

      - name: Download unit coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: unit-coverage
          path: coverage/unit

      - name: Download renderer coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: renderer-coverage-*
          path: .vitest/blob
          merge-multiple: true

      - name: Merge renderer coverage
        run: npx vitest --merge-reports --config vitest.renderer.config.ts --coverage --coverage.reporter=lcov --coverage.reportsDirectory=coverage/renderer --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 --coverage.thresholds.statements=0

      - name: Validate merged LCOV
        shell: bash
        run: |
          test -s coverage/unit/lcov.info
          test -s coverage/renderer/lcov.info

      - name: Run Sonar finding gate
        shell: bash
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            SONAR_SCOPE=(--pull-request="${{ github.event.pull_request.number }}")
          else
            SONAR_SCOPE=(--branch=main --require-clean)
          fi

          npm run security:sonar:ci -- "${SONAR_SCOPE[@]}"

  snyk:
    name: Snyk security gate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        env:
          RELAY_SKIP_POCKETBASE_DOWNLOAD: '1'
        run: npm ci --prefer-offline

      - name: Run Snyk finding gate
        env:
          SNYK_ORG: ${{ vars.SNYK_ORG }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: npm run security:snyk:ci

  # Credential-free, so it also gates fork pull requests.
  codeql:
    name: CodeQL security gate
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: javascript-typescript,actions
          build-mode: none
          queries: security-extended

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          output: codeql-results

      - name: Run CodeQL finding gate
        run: node scripts/codeql-finding-gate.mjs

  quality:
    name: Build quality gate
    if: always()
    needs: [static, unit-coverage, renderer-coverage, windows-unit, workflow-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful build components
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_COVERAGE_RESULT: ${{ needs.unit-coverage.result }}
          RENDERER_COVERAGE_RESULT: ${{ needs.renderer-coverage.result }}
          WINDOWS_UNIT_RESULT: ${{ needs.windows-unit.result }}
          WORKFLOW_TESTS_RESULT: ${{ needs.workflow-tests.result }}
        shell: bash
        run: |
          if [[ "$STATIC_RESULT" != "success" ||
                "$UNIT_COVERAGE_RESULT" != "success" ||
                "$RENDERER_COVERAGE_RESULT" != "success" ||
                "$WINDOWS_UNIT_RESULT" != "success" ||
                "$WORKFLOW_TESTS_RESULT" != "success" ]]; then
            echo "Build components did not all succeed: static=$STATIC_RESULT unit-coverage=$UNIT_COVERAGE_RESULT renderer-coverage=$RENDERER_COVERAGE_RESULT windows-unit=$WINDOWS_UNIT_RESULT workflow-tests=$WORKFLOW_TESTS_RESULT"
            exit 1
          fi

  package-windows:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/reusable-windows-package.yml
    with:
      artifact-name: relay-windows
      baseline-branch: main
      baseline-workflow: release.yml
      compression: store
      publish: never
      source-sha: ${{ github.sha }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
