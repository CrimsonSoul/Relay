name: Build and Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - pb
      - test
  pull_request:
    branches:
      - main
      - test

permissions:
  contents: read

# Rapid pushes to the same branch cancel superseded runs instead of queueing.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  provenance:
    name: Resolve exact-tree reuse
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.resolve.outputs.eligible }}
      reuse: ${{ steps.resolve.outputs.reuse }}
      pull-request: ${{ steps.resolve.outputs.pull-request }}
      head-sha: ${{ steps.resolve.outputs.head-sha }}
      head-tree: ${{ steps.resolve.outputs.head-tree }}
      security-run-id: ${{ steps.resolve.outputs.security-run-id }}
      coverage-artifact: ${{ steps.resolve.outputs.coverage-artifact }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve exact-tree reuse
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELAY_CI_TREE_REUSE_MODE: ${{ vars.RELAY_CI_TREE_REUSE_MODE }}
        run: node scripts/ciTreeReuse.mjs

  static:
    name: Static checks
    if: needs.provenance.outputs.reuse != 'true'
    needs: provenance
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Get Electron version
        id: electron-version
        run: |
          ELECTRON_VER=$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")
          echo "version=$ELECTRON_VER" >> "$GITHUB_OUTPUT"

      - name: Cache Electron binary
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: ~/.cache/electron
          key: electron-linux-x64-${{ steps.electron-version.outputs.version }}

      - name: Cache static analysis results
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: |
            .cache/eslint
            .cache/prettier
          key: static-analysis-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js', '.prettierrc', '.prettierignore') }}-${{ github.sha }}
          restore-keys: static-analysis-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js', '.prettierrc', '.prettierignore') }}-

      - name: Install dependencies
        env:
          RELAY_SKIP_POCKETBASE_DOWNLOAD: '1'
        run: npm ci --prefer-offline

      - name: Static checks (typecheck + lint + format, parallel)
        run: |
          npm run typecheck & TYPECHECK=$!
          npm run lint & LINT=$!
          npm run format:check & FORMAT=$!
          npm audit --audit-level=high --omit=dev & AUDIT=$!
          wait $TYPECHECK && wait $LINT && wait $FORMAT && wait $AUDIT

  unit-tests:
    name: Unit tests
    if: needs.provenance.outputs.reuse != 'true'
    needs: provenance
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        env:
          RELAY_SKIP_POCKETBASE_DOWNLOAD: '1'
        run: npm ci --prefer-offline

      - name: Run unit tests
        run: npm run test:unit && npm run test:cache

  renderer-tests:
    name: Renderer tests (${{ matrix.shard-index }}/${{ matrix.shard-total }})
    if: needs.provenance.outputs.reuse != 'true'
    needs: provenance
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    strategy:
      fail-fast: false
      matrix:
        shard-index: [1, 2]
        shard-total: [2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        env:
          RELAY_SKIP_POCKETBASE_DOWNLOAD: '1'
        run: npm ci --prefer-offline

      - name: Run renderer tests
        run: npm run test:renderer -- --shard=${{ matrix.shard-index }}/${{ matrix.shard-total }}

  quality:
    name: Build quality gate
    if: always()
    needs: [provenance, static, unit-tests, renderer-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful build components
        env:
          ELIGIBLE: ${{ needs.provenance.outputs.eligible }}
          PROVENANCE_RESULT: ${{ needs.provenance.result }}
          REUSE: ${{ needs.provenance.outputs.reuse }}
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          RENDERER_TESTS_RESULT: ${{ needs.renderer-tests.result }}
        shell: bash
        run: |
          if [[ "$PROVENANCE_RESULT" != "success" ]]; then
            echo "Tree reuse provenance did not succeed: provenance=$PROVENANCE_RESULT"
            exit 1
          fi

          if [[ "$REUSE" == "true" ]]; then
            if [[ "$ELIGIBLE" == "true" ]]; then
              exit 0
            fi
            echo "Tree reuse was enabled without validated eligibility."
            exit 1
          fi

          if [[ "$STATIC_RESULT" != "success" ||
                "$UNIT_TESTS_RESULT" != "success" ||
                "$RENDERER_TESTS_RESULT" != "success" ]]; then
            echo "Build components did not all succeed: static=$STATIC_RESULT unit-tests=$UNIT_TESTS_RESULT renderer-tests=$RENDERER_TESTS_RESULT"
            exit 1
          fi

      - name: Write PR provenance attestation
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          printf 'pull_request=%s\nbase_sha=%s\nhead_sha=%s\n' \
            "$PR_NUMBER" "$BASE_SHA" "$HEAD_SHA" \
            > "$RUNNER_TEMP/relay-pr-provenance.txt"
          test -s "$RUNNER_TEMP/relay-pr-provenance.txt"

      - name: Upload PR provenance attestation
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: relay-pr-provenance-${{ github.event.pull_request.number }}-${{ github.event.pull_request.base.sha }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/relay-pr-provenance.txt
          if-no-files-found: error
          retention-days: 1

  package-windows:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/pb'))
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/reusable-windows-package.yml
    with:
      artifact-name: relay-windows
      baseline-branch: ${{ github.ref_name }}
      baseline-workflow: build.yml
      compression: store
      publish: never
      source-sha: ${{ github.sha }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
