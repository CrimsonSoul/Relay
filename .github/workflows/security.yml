name: Security and Code Quality

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube quality gate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/test') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'test' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        env:
          RELAY_SKIP_POCKETBASE_DOWNLOAD: '1'
        run: npm ci --prefer-offline

      - name: Generate LCOV coverage
        run: npm run test:coverage:sonar

      - name: Run SonarQube analysis and wait for the quality gate
        shell: bash
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -z "$SONAR_TOKEN" || -z "$SONAR_ORGANIZATION" ]]; then
            echo "SONAR_TOKEN and SONAR_ORGANIZATION must be configured."
            exit 1
          fi
          if [[ -n "$SONAR_HOST_URL" && "$SONAR_HOST_URL" != https://* ]]; then
            echo "SONAR_HOST_URL must use HTTPS."
            exit 1
          fi

          SONAR_ARGS=(
            "-Dsonar.organization=$SONAR_ORGANIZATION"
            "-Dsonar.qualitygate.wait=true"
            "-Dsonar.qualitygate.timeout=300"
          )
          if [[ -n "$SONAR_HOST_URL" ]]; then
            SONAR_ARGS+=("-Dsonar.host.url=$SONAR_HOST_URL")
          fi

          npm run security:sonar -- "${SONAR_ARGS[@]}"

      - name: Reconcile exact reviewed Sonar issues
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/test'
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: npm run security:sonar:reviewed -- --branch=test --apply

      - name: Verify no unresolved Sonar issues remain
        shell: bash
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            SONAR_SCOPE=("--pull-request=${{ github.event.pull_request.number }}")
          else
            SONAR_SCOPE=("--branch=test")
          fi

          npm run security:sonar:issues -- "${SONAR_SCOPE[@]}"

  snyk:
    name: Snyk security gate
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        env:
          RELAY_SKIP_POCKETBASE_DOWNLOAD: '1'
        run: npm ci --prefer-offline

      - name: Run Snyk Open Source and Code scans
        shell: bash
        env:
          SNYK_ORG: ${{ vars.SNYK_ORG }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [[ -z "$SNYK_TOKEN" || -z "$SNYK_ORG" ]]; then
            echo "SNYK_TOKEN and SNYK_ORG must be configured."
            exit 1
          fi

          npm run security:snyk:open-source -- \
            "--org=$SNYK_ORG" \
            "--project-name=${{ github.repository }}" \
            "--target-reference=test" \
            "--remote-repo-url=${{ github.server_url }}/${{ github.repository }}.git"
          npm run security:snyk:code -- "--org=$SNYK_ORG"

      - name: Update the Snyk test-branch dependency snapshot
        env:
          SNYK_ORG: ${{ vars.SNYK_ORG }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          npm run security:snyk:monitor -- \
            "--org=$SNYK_ORG" \
            "--project-name=${{ github.repository }}" \
            "--target-reference=test" \
            "--remote-repo-url=${{ github.server_url }}/${{ github.repository }}.git"
