name: Reusable Windows Package

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Artifact name uploaded by the packaging job.
        required: true
        type: string
      baseline-branch:
        description: Branch used to find the previous successful Windows artifact.
        required: true
        type: string
      baseline-workflow:
        description: Workflow used to find the previous successful Windows artifact.
        required: true
        type: string
      compression:
        description: electron-builder compression mode for the production artifact.
        required: true
        type: string
      publish:
        description: electron-builder publish policy.
        required: true
        type: string
      release-version:
        description: Normal semantic version embedded in a release package.
        required: false
        default: ''
        type: string
      source-sha:
        description: Exact source commit packaged by the caller.
        required: true
        type: string
    secrets:
      github-token:
        description: Token used only to read previous workflow artifacts.
        required: true
    outputs:
      artifact-name:
        description: Artifact name uploaded by the packaging job.
        value: ${{ jobs.package.outputs.artifact-name }}

permissions:
  actions: read
  contents: read

jobs:
  package:
    runs-on: windows-latest
    outputs:
      artifact-name: ${{ inputs.artifact-name }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      RELAY_BUILD_ID: r1-${{ inputs.source-sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source-sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Get Electron version
        id: electron-version
        shell: bash
        run: |
          ELECTRON_VER=$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")
          echo "version=$ELECTRON_VER" >> "$GITHUB_OUTPUT"

      - name: Cache Electron binary
        continue-on-error: true
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/AppData/Local/electron/Cache
            .electron
          key: electron-win-x64-${{ steps.electron-version.outputs.version }}

      # electron-builder re-downloads NSIS/winCodeSign tooling every run otherwise.
      - name: Cache electron-builder tooling
        continue-on-error: true
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/AppData/Local/electron-builder/Cache
          key: electron-builder-win-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-builder-win-

      # Native-module rebuild (better-sqlite3) compiles against Electron headers.
      - name: Cache Electron headers
        continue-on-error: true
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.electron-gyp
          key: electron-gyp-win-${{ steps.electron-version.outputs.version }}

      - name: Get PocketBase version
        id: pocketbase-version
        shell: bash
        run: |
          PB_VER=$(node scripts/download-pocketbase.mjs --print-version)
          echo "version=$PB_VER" >> "$GITHUB_OUTPUT"

      - name: Cache PocketBase binary
        id: pocketbase-cache
        continue-on-error: true
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: resources/pocketbase/win32-x64
          key: pocketbase-win32-x64-${{ steps.pocketbase-version.outputs.version }}

      - name: Install dependencies
        env:
          RELAY_SKIP_POCKETBASE_DOWNLOAD: '1'
        run: npm ci --prefer-offline

      - name: Verify Windows updater and private directory security
        run: >-
          npx vitest run
          src/main/releases
          src/main/pocketbase/WindowsPrivateDirectory.windows.test.ts

      - name: Cache rebuilt better-sqlite3
        id: better-sqlite-cache
        continue-on-error: true
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: node_modules/better-sqlite3/build/Release
          key: better-sqlite3-electron-win-${{ steps.electron-version.outputs.version }}-${{ hashFiles('package-lock.json') }}

      - name: Install Electron native dependencies
        if: steps.better-sqlite-cache.outputs.cache-hit != 'true'
        run: npx electron-builder install-app-deps --platform=win32 --arch=x64

      - name: Build Relay once
        run: npm run build

      - name: Download PocketBase binary
        if: steps.pocketbase-cache.outputs.cache-hit != 'true'
        run: node scripts/download-pocketbase.mjs --platform=win32 --arch=x64

      - name: Verify PocketBase binary exists
        shell: bash
        run: |
          if [ -f "resources/pocketbase/win32-x64/pocketbase.exe" ]; then
            echo "PocketBase binary found"
            ls -la resources/pocketbase/win32-x64/
          else
            echo "ERROR: PocketBase binary not found!"
            ls -la resources/pocketbase/ 2>/dev/null || echo "resources/pocketbase/ does not exist"
            exit 1
          fi

      - name: Find previous successful Windows artifact
        id: previous
        shell: pwsh
        env:
          BASELINE_BRANCH: ${{ inputs.baseline-branch }}
          BASELINE_WORKFLOW: ${{ inputs.baseline-workflow }}
          GH_TOKEN: ${{ secrets['github-token'] }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: >-
          ./scripts/find-previous-windows-artifact.ps1
          -Workflow "$env:BASELINE_WORKFLOW"
          -Branch "$env:BASELINE_BRANCH"
          -CurrentSha "$env:SOURCE_SHA"
          -Destination "$env:RUNNER_TEMP\RelayPrevious.exe"

      - name: Build lightweight previous fixture when no artifact exists
        if: steps.previous.outputs.found != 'true'
        env:
          RELAY_BUILD_ID: ${{ steps.previous.outputs.build_id }}
        run: node scripts/package-windows.mjs --fixture --config.compression=store --config.npmRebuild=false

      - name: Preserve lightweight previous fixture
        if: steps.previous.outputs.found != 'true'
        shell: pwsh
        run: Move-Item -LiteralPath ./release/Relay.exe -Destination "$env:RUNNER_TEMP\RelayPrevious.exe"

      - name: Build and package
        env:
          COMPRESSION: ${{ inputs.compression }}
          PUBLISH_POLICY: ${{ inputs.publish }}
          RELAY_RELEASE_VERSION: ${{ inputs.release-version }}
        run: >-
          node scripts/package-windows.mjs
          --config.compression="$env:COMPRESSION"
          --config.npmRebuild=false
          --publish "$env:PUBLISH_POLICY"

      - name: Verify packaged release version
        if: inputs.release-version != ''
        shell: pwsh
        env:
          RELAY_RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          $versionInfo = (Get-Item -LiteralPath './release/Relay.exe').VersionInfo
          $actualCore = "$($versionInfo.FileMajorPart).$($versionInfo.FileMinorPart).$($versionInfo.FileBuildPart)"
          if ($actualCore -ne $env:RELAY_RELEASE_VERSION) {
            throw "Packaged version $actualCore does not match release version $env:RELAY_RELEASE_VERSION"
          }
          Write-Host "Verified packaged release version $actualCore."

      - name: Smoke test persistent bootstrap
        shell: pwsh
        env:
          RELAY_EXPECTED_BUILD_ID: r1-${{ inputs.source-sha }}
          RELAY_EXPECTED_TARGET_COMMITISH: ${{ inputs.source-sha }}
          RELAY_EXPECTED_LAUNCHER_PROTOCOL_EXIT_CODE: 105
          RELAY_BOOTSTRAP_SMOKE_CONFIRM: 1
        run: >-
          ./scripts/windows-bootstrap-smoke.ps1
          -Artifact ./release/Relay.exe
          -PreviousArtifact "$env:RUNNER_TEMP\RelayPrevious.exe"
          -ExpectedBuildId "$env:RELAY_EXPECTED_BUILD_ID"
          -ExpectedPreviousBuildId "${{ steps.previous.outputs.build_id }}"
          -ExpectedTargetCommitish "$env:RELAY_EXPECTED_TARGET_COMMITISH"
          -ExpectedLauncherProtocolExitCode "$env:RELAY_EXPECTED_LAUNCHER_PROTOCOL_EXIT_CODE"

      - name: Benchmark packaged startup paths
        shell: pwsh
        env:
          COMPRESSION: ${{ inputs.compression }}
          RELAY_BOOTSTRAP_BENCHMARK_CONFIRM: 1
        run: |
          node scripts/benchmark-startup.mjs --scenario prepare --artifact ./release/Relay.exe --compression "$env:COMPRESSION"
          node scripts/benchmark-startup.mjs --scenario stable --launcher "$env:LOCALAPPDATA\Relay\Relay.exe" --compression "$env:COMPRESSION" --runs 5

      - name: Capture packaged startup diagnostics
        if: failure()
        shell: pwsh
        run: |
          $diagnostics = Join-Path $env:RUNNER_TEMP 'relay-startup-diagnostics'
          New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
          $logRoot = Join-Path $env:APPDATA 'Relay\logs'
          if (Test-Path -LiteralPath $logRoot) {
            Copy-Item -LiteralPath $logRoot -Destination $diagnostics -Recurse
          }
          $statePath = Join-Path $env:LOCALAPPDATA 'Relay\state.ini'
          if (Test-Path -LiteralPath $statePath) {
            Copy-Item -LiteralPath $statePath -Destination $diagnostics
          }
          Get-CimInstance Win32_Process |
            Where-Object { $_.Name -in @('Relay.exe', 'pocketbase.exe') } |
            Select-Object Name, ProcessId, ParentProcessId, ExecutablePath, CreationDate |
            ConvertTo-Json -Depth 3 |
            Set-Content -LiteralPath (Join-Path $diagnostics 'processes.json')
          $runtimeRoot = Join-Path $env:LOCALAPPDATA 'Relay'
          $runtimeFiles = if (Test-Path -LiteralPath $runtimeRoot) {
            @(Get-ChildItem -LiteralPath $runtimeRoot -Recurse -Force |
              Select-Object FullName, Length, LastWriteTimeUtc)
          } else {
            @()
          }
          ConvertTo-Json -InputObject $runtimeFiles -Depth 3 |
            Set-Content -LiteralPath (Join-Path $diagnostics 'runtime-files.json')
          $markerRoot = Join-Path $env:TEMP 'Relay\startup-benchmark'
          $benchmarkMarkers = if (Test-Path -LiteralPath $markerRoot) {
            @(Get-ChildItem -LiteralPath $markerRoot -Force |
              Select-Object FullName, Length, LastWriteTimeUtc)
          } else {
            @()
          }
          ConvertTo-Json -InputObject $benchmarkMarkers -Depth 3 |
            Set-Content -LiteralPath (Join-Path $diagnostics 'benchmark-markers.json')

      - name: Upload packaged startup diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: relay-windows-startup-diagnostics
          path: ${{ runner.temp }}/relay-startup-diagnostics

      - name: Preserve production artifact for boundary harness
        shell: pwsh
        run: Move-Item -LiteralPath ./release/Relay.exe -Destination "$env:RUNNER_TEMP\RelayProduction.exe"

      - name: Resolve updater fixture versions
        id: updater-fixture-versions
        shell: bash
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          TARGET_VERSION=$(node -p "const [major, minor, patch] = require('./package.json').version.split('.').map(Number); [major, minor, patch + 1].join('.')")
          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build previous isolated boundary fixture
        env:
          RELAY_BUILD_ID: h0-${{ inputs.source-sha }}
          RELAY_BOOTSTRAP_HARNESS: 1
          RELAY_BOOTSTRAP_HARNESS_ROOT: ${{ runner.temp }}\relay-boundary-${{ github.run_id }}-${{ github.run_attempt }}\Relay
          RELAY_RELEASE_VERSION: ${{ steps.updater-fixture-versions.outputs.current }}
        run: node scripts/package-windows.mjs --fixture --config.compression=store --config.npmRebuild=false

      - name: Preserve previous isolated boundary fixture
        shell: pwsh
        run: Move-Item -LiteralPath ./release/Relay.exe -Destination "$env:RUNNER_TEMP\RelayBoundaryPrevious.exe"

      - name: Build current isolated boundary fixture
        env:
          RELAY_BUILD_ID: h1-${{ inputs.source-sha }}
          RELAY_BOOTSTRAP_HARNESS: 1
          RELAY_BOOTSTRAP_HARNESS_ROOT: ${{ runner.temp }}\relay-boundary-${{ github.run_id }}-${{ github.run_attempt }}\Relay
          RELAY_RELEASE_VERSION: ${{ steps.updater-fixture-versions.outputs.target }}
        run: node scripts/package-windows.mjs --fixture --config.compression=store --config.npmRebuild=false

      - name: Exercise isolated activation boundaries and stable fallback
        shell: pwsh
        env:
          RELAY_EXPECTED_BUILD_ID: h1-${{ inputs.source-sha }}
          RELAY_EXPECTED_PREVIOUS_BUILD_ID: h0-${{ inputs.source-sha }}
          RELAY_BOOTSTRAP_BOUNDARY_CONFIRM: 1
        run: >-
          ./scripts/windows-bootstrap-boundary-smoke.ps1
          -Artifact ./release/Relay.exe
          -PreviousArtifact "$env:RUNNER_TEMP\RelayBoundaryPrevious.exe"
          -Root "$env:RUNNER_TEMP\relay-boundary-${{ github.run_id }}-${{ github.run_attempt }}\Relay"
          -ExpectedBuildId "$env:RELAY_EXPECTED_BUILD_ID"
          -ExpectedPreviousBuildId "$env:RELAY_EXPECTED_PREVIOUS_BUILD_ID"
          -ExpectedTargetVersion "${{ steps.updater-fixture-versions.outputs.target }}"

      - name: Exercise verified updater download and reveal
        shell: pwsh
        env:
          RELAY_UPDATER_INTEGRATION_CONFIRM: 1
          RELAY_UPDATER_INTEGRATION_ROOT: ${{ runner.temp }}\relay-boundary-${{ github.run_id }}-${{ github.run_attempt }}\Relay
          RELAY_UPDATER_INTEGRATION_CURRENT_ARTIFACT: ${{ runner.temp }}\RelayBoundaryPrevious.exe
          RELAY_UPDATER_INTEGRATION_TARGET_ARTIFACT: ${{ runner.temp }}\RelayProduction.exe
          RELAY_UPDATER_INTEGRATION_ARCHIVE: ${{ runner.temp }}\relay-updater-assets\Relay-v${{ steps.updater-fixture-versions.outputs.target }}-windows-x64.zip
          RELAY_UPDATER_INTEGRATION_CHECKSUM: ${{ runner.temp }}\relay-updater-assets\Relay-v${{ steps.updater-fixture-versions.outputs.target }}-windows-x64.zip.sha256
          RELAY_UPDATER_INTEGRATION_CURRENT_BUILD_ID: h0-${{ inputs.source-sha }}
          RELAY_UPDATER_INTEGRATION_TARGET_BUILD_ID: h1-${{ inputs.source-sha }}
          RELAY_UPDATER_INTEGRATION_CURRENT_VERSION: ${{ steps.updater-fixture-versions.outputs.current }}
          RELAY_UPDATER_INTEGRATION_TARGET_VERSION: ${{ steps.updater-fixture-versions.outputs.target }}
          RELAY_UPDATER_INTEGRATION_TARGET_COMMITISH: ${{ inputs.source-sha }}
        run: |
          $assetRoot = Split-Path -Parent $env:RELAY_UPDATER_INTEGRATION_ARCHIVE
          New-Item -ItemType Directory -Path $assetRoot -Force | Out-Null
          $archiveSource = Join-Path $assetRoot 'Relay.exe'
          Copy-Item -LiteralPath $env:RELAY_UPDATER_INTEGRATION_TARGET_ARTIFACT -Destination $archiveSource
          Compress-Archive -LiteralPath $archiveSource -DestinationPath $env:RELAY_UPDATER_INTEGRATION_ARCHIVE
          $archiveName = Split-Path -Leaf $env:RELAY_UPDATER_INTEGRATION_ARCHIVE
          $archiveHash = (Get-FileHash -LiteralPath $env:RELAY_UPDATER_INTEGRATION_ARCHIVE -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            $env:RELAY_UPDATER_INTEGRATION_CHECKSUM,
            "$archiveHash  $archiveName`n",
            [Text.UTF8Encoding]::new($false)
          )
          npx vitest run src/main/releases/ReleaseUpdateManager.windows.integration.test.ts

      - name: Restore production artifact
        shell: pwsh
        run: |
          Remove-Item -LiteralPath ./release/Relay.exe -Force
          Move-Item -LiteralPath "$env:RUNNER_TEMP\RelayProduction.exe" -Destination ./release/Relay.exe

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact-name }}
          path: release/*.exe
