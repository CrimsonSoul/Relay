name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: relay-release-main
  cancel-in-progress: false

jobs:
  gates:
    name: Verify required main gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source-sha: ${{ steps.required.outputs.source-sha }}
    steps:
      - name: Wait for exact commit gates
        id: required
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const requiredNames = [
              'Build quality gate',
              'SonarQube quality gate',
              'Snyk security gate',
            ];
            if (context.ref !== 'refs/heads/main') {
              throw new Error(`Release workflow rejected unexpected ref ${context.ref}`);
            }

            const sourceSha = context.sha;
            const deadline = Date.now() + 25 * 60 * 1000;
            let lastSummary = 'required checks have not appeared yet';

            while (Date.now() < deadline) {
              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sourceSha,
                filter: 'latest',
                per_page: 100,
              });
              const byName = new Map(
                checkRuns
                  .filter((run) => run.app?.slug === 'github-actions')
                  .map((run) => [run.name, run]),
              );
              const failed = requiredNames.filter((name) => {
                const run = byName.get(name);
                return run?.status === 'completed' && run.conclusion !== 'success';
              });
              if (failed.length > 0) {
                throw new Error(`Release blocked by unsuccessful checks: ${failed.join(', ')}`);
              }

              const waiting = requiredNames.filter((name) => {
                const run = byName.get(name);
                return run?.status !== 'completed' || run.conclusion !== 'success';
              });
              if (waiting.length === 0) {
                core.setOutput('source-sha', sourceSha);
                core.info(`All required checks succeeded for ${sourceSha}.`);
                return;
              }

              lastSummary = waiting
                .map((name) => {
                  const run = byName.get(name);
                  return `${name}=${run ? `${run.status}/${run.conclusion ?? 'pending'}` : 'missing'}`;
                })
                .join(', ');
              core.info(`Waiting for ${sourceSha}: ${lastSummary}`);
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }

            throw new Error(`Timed out waiting for required checks on ${sourceSha}: ${lastSummary}`);

  determine:
    name: Determine release version
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.version.outputs.action }}
      should-package: ${{ steps.existing-assets.outputs.should-package || steps.release-state.outputs.should-package }}
      source-sha: ${{ steps.version.outputs.source_sha }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Determine semantic version
        id: version
        run: node scripts/release-version.mjs

      - name: Resolve existing release state
        id: release-state
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_ACTION: ${{ steps.version.outputs.action }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        with:
          script: |
            const action = process.env.RELEASE_ACTION;
            const tag = process.env.RELEASE_TAG;
            const version = process.env.RELEASE_VERSION;
            const sourceSha = process.env.SOURCE_SHA;
            const expectedAsset = `Relay-${tag}-windows-x64.zip`;
            const expectedChecksum = `${expectedAsset}.sha256`;
            core.setOutput('complete', 'false');

            if (action === 'skip') {
              core.setOutput('should-package', 'false');
              core.notice('No release-worthy conventional commits were found.');
              return;
            }
            if (!['create', 'verify'].includes(action)) {
              throw new Error(`Unexpected release action: ${action}`);
            }
            if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag)) {
              throw new Error(`Unexpected release tag: ${tag}`);
            }
            if (version !== tag.slice(1) || !/^[0-9a-f]{40}$/.test(sourceSha)) {
              throw new Error('Release version outputs are inconsistent');
            }

            let ref;
            try {
              ref = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (action === 'create') {
              if (ref) throw new Error(`Refusing to reuse existing tag ${tag}`);
              core.setOutput('should-package', 'true');
              return;
            }
            if (!ref) throw new Error(`Expected existing tag ${tag}`);

            let object = ref.data.object;
            for (let depth = 0; object.type === 'tag' && depth < 5; depth += 1) {
              const annotated = await github.rest.git.getTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_sha: object.sha,
              });
              object = annotated.data.object;
            }
            if (object.type !== 'commit' || object.sha !== sourceSha) {
              throw new Error(`Tag ${tag} does not resolve to ${sourceSha}`);
            }

            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (!release) {
              core.setOutput('should-package', 'true');
              return;
            }

            const { classifyExistingRelease } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/releaseWorkflowContract.mjs`
            );
            const releaseState = classifyExistingRelease(release.data, {
              expectedAsset,
              expectedChecksum,
              sourceSha,
            });
            const complete = releaseState === 'complete';
            core.setOutput('should-package', complete ? 'false' : 'true');
            core.setOutput('complete', complete ? 'true' : 'false');
            core.setOutput('replace-draft', releaseState === 'replace-draft' ? 'true' : 'false');
            if (complete) core.info(`${tag} has canonical release metadata and assets.`);

      - name: Verify existing release assets
        id: existing-assets
        if: steps.release-state.outputs.complete == 'true'
        shell: bash
        env:
          ASSET_NAME: Relay-${{ steps.version.outputs.tag }}-windows-x64.zip
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          test "$(jq -r .target_commitish <<<"$release_json")" = "$SOURCE_SHA"
          test "$(jq '.assets | length' <<<"$release_json")" = '2'
          test "$(jq -r --arg archive "$ASSET_NAME" --arg checksum "$ASSET_NAME.sha256" '
            ([.assets[].name] | sort) == ([$archive, $checksum] | sort)
          ' <<<"$release_json")" = 'true'
          test "$(jq -r '.assets | all(
            .state == "uploaded" and
            (.size | type == "number") and
            .size > 0 and
            (.digest != null and (.digest | test("^sha256:[0-9a-f]{64}$")))
          )' <<<"$release_json")" = 'true'
          archive_digest="$(jq -r --arg name "$ASSET_NAME" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
          checksum_digest="$(jq -r --arg name "$ASSET_NAME.sha256" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
          verify_dir="$(mktemp -d)"
          gh release download "$TAG" \
            --pattern "$ASSET_NAME" \
            --pattern "$ASSET_NAME.sha256" \
            --dir "$verify_dir"
          (
            cd "$verify_dir"
            sha256sum --check "$ASSET_NAME.sha256"
            unzip -tqq "$ASSET_NAME"
            test "$(unzip -Z1 "$ASSET_NAME")" = 'Relay.exe'
            test "sha256:$(sha256sum "$ASSET_NAME" | cut -d' ' -f1)" = "$archive_digest"
            test "sha256:$(sha256sum "$ASSET_NAME.sha256" | cut -d' ' -f1)" = "$checksum_digest"
          )
          immutable='false'
          for _attempt in $(seq 1 24); do
            immutable="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .immutable)"
            test "$immutable" = 'true' && break
            sleep 5
          done
          test "$immutable" = 'true'
          echo 'should-package=false' >> "$GITHUB_OUTPUT"
          echo "Existing immutable $TAG assets and checksum are complete."

  package-windows:
    needs: determine
    if: needs.determine.outputs.should-package == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/reusable-windows-package.yml
    with:
      artifact-name: relay-windows
      baseline-branch: main
      baseline-workflow: release.yml
      compression: normal
      publish: never
      release-version: ${{ needs.determine.outputs.version }}
      source-sha: ${{ needs.determine.outputs.source-sha }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Publish GitHub release
    needs: [gates, determine, package-windows]
    if: >-
      needs.gates.result == 'success' &&
      needs.determine.outputs.should-package == 'true' &&
      needs.package-windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.determine.outputs.source-sha }}

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.package-windows.outputs.artifact-name }}
          path: release/

      - name: Create versioned release assets
        id: assets
        shell: bash
        env:
          TAG: ${{ needs.determine.outputs.tag }}
        run: |
          set -euo pipefail
          asset_name="Relay-${TAG}-windows-x64.zip"
          (
            cd release
            zip -j "$asset_name" Relay.exe
            unzip -tqq "$asset_name"
            test "$(unzip -Z1 "$asset_name")" = 'Relay.exe'
            sha256sum "$asset_name" > "$asset_name.sha256"
          )
          archive_sha256="$(sha256sum "release/$asset_name" | cut -d' ' -f1)"
          checksum_sha256="$(sha256sum "release/$asset_name.sha256" | cut -d' ' -f1)"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
          echo "checksum_sha256=$checksum_sha256" >> "$GITHUB_OUTPUT"

      - name: Replace incomplete draft release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_ACTION: ${{ needs.determine.outputs.action }}
          TAG: ${{ needs.determine.outputs.tag }}
        with:
          script: |
            const tag = process.env.TAG;
            const action = process.env.RELEASE_ACTION;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const matches = releases.filter((release) => release.tag_name === tag);
            if (matches.length > 1) {
              throw new Error(`Expected at most one release for ${tag}, found ${matches.length}`);
            }
            if (matches.length === 0) return;

            const release = matches[0];
            if (!['create', 'verify'].includes(action) || release.draft !== true) {
              throw new Error(`Refusing to replace non-draft release state for ${tag}`);
            }
            await github.rest.repos.deleteRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
            });
            core.info(`Removed incomplete draft ${tag} before clean asset upload.`);

      - name: Create draft GitHub release
        id: publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            release/${{ steps.assets.outputs.asset_name }}
            release/${{ steps.assets.outputs.asset_name }}.sha256
          generate_release_notes: true
          make_latest: false
          name: Relay ${{ needs.determine.outputs.tag }}
          prerelease: false
          tag_name: ${{ needs.determine.outputs.tag }}
          target_commitish: ${{ needs.determine.outputs.source-sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Finalize immutable GitHub release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          ARCHIVE_SHA256: ${{ steps.assets.outputs.archive_sha256 }}
          ASSET_NAME: ${{ steps.assets.outputs.asset_name }}
          CHECKSUM_SHA256: ${{ steps.assets.outputs.checksum_sha256 }}
          SOURCE_SHA: ${{ needs.determine.outputs.source-sha }}
          TAG: ${{ needs.determine.outputs.tag }}
        with:
          script: |
            const tag = process.env.TAG;
            const sourceSha = process.env.SOURCE_SHA;
            const assetName = process.env.ASSET_NAME;
            const expectedNames = new Set([assetName, `${assetName}.sha256`]);
            const expectedDigests = new Map([
              [assetName, `sha256:${process.env.ARCHIVE_SHA256}`],
              [`${assetName}.sha256`, `sha256:${process.env.CHECKSUM_SHA256}`],
            ]);
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const matches = releases.filter((release) => release.tag_name === tag);
            if (matches.length !== 1) {
              throw new Error(`Expected one draft release for ${tag}, found ${matches.length}`);
            }

            const release = matches[0];
            if (release.draft !== true || release.prerelease !== false) {
              throw new Error(`${tag} was not a normal draft release`);
            }
            if (release.target_commitish !== sourceSha) {
              throw new Error(`${tag} did not target the verified main commit`);
            }
            if (release.assets.length !== 2) {
              throw new Error(`${tag} did not contain exactly two assets`);
            }
            for (const asset of release.assets) {
              if (
                !expectedNames.delete(asset.name) ||
                asset.state !== 'uploaded' ||
                !Number.isSafeInteger(asset.size) ||
                asset.size <= 0 ||
                !/^sha256:[0-9a-f]{64}$/.test(asset.digest ?? '') ||
                asset.digest !== expectedDigests.get(asset.name)
              ) {
                throw new Error(`${tag} contained invalid release asset metadata`);
              }
            }
            if (expectedNames.size !== 0) {
              throw new Error(`${tag} was missing an expected release asset`);
            }

            let tagRef;
            try {
              tagRef = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              tagRef = await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: sourceSha,
              });
              core.info(`Created ${tag} at the verified main commit.`);
            }
            let object = tagRef.data.object;
            for (let depth = 0; object.type === 'tag' && depth < 5; depth += 1) {
              const annotated = await github.rest.git.getTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_sha: object.sha,
              });
              object = annotated.data.object;
            }
            if (object.type !== 'commit' || object.sha !== sourceSha) {
              throw new Error(`Tag ${tag} did not resolve to the verified main commit`);
            }

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });

      - name: Verify published release
        shell: bash
        env:
          ASSET_NAME: ${{ steps.assets.outputs.asset_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.determine.outputs.source-sha }}
          TAG: ${{ needs.determine.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .draft)" = 'false'
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .prerelease)" = 'false'
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG"
          immutable='false'
          for _attempt in $(seq 1 24); do
            immutable="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .immutable)"
            test "$immutable" = 'true' && break
            sleep 5
          done
          test "$immutable" = 'true'
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          test "$(jq '.assets | length' <<<"$release_json")" = '2'
          test "$(jq -r '.assets | map(.digest) | all(. != null and test("^sha256:[0-9a-f]{64}$"))' <<<"$release_json")" = 'true'
          archive_digest="$(jq -r --arg name "$ASSET_NAME" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
          checksum_digest="$(jq -r --arg name "$ASSET_NAME.sha256" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
          verify_dir="$(mktemp -d)"
          gh release download "$TAG" --pattern "$ASSET_NAME" --pattern "$ASSET_NAME.sha256" --dir "$verify_dir"
          (
            cd "$verify_dir"
            sha256sum --check "$ASSET_NAME.sha256"
            unzip -tqq "$ASSET_NAME"
            test "$(unzip -Z1 "$ASSET_NAME")" = 'Relay.exe'
            test "sha256:$(sha256sum "$ASSET_NAME" | cut -d' ' -f1)" = "$archive_digest"
            test "sha256:$(sha256sum "$ASSET_NAME.sha256" | cut -d' ' -f1)" = "$checksum_digest"
          )
          release_url="$(gh release view "$TAG" --json url --jq .url)"
          echo "Published and verified [$TAG]($release_url)." >> "$GITHUB_STEP_SUMMARY"
