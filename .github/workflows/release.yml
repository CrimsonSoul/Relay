name: Build and Release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Get Electron version
        id: electron-version
        run: |
          ELECTRON_VER=$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")
          echo "version=$ELECTRON_VER" >> "$GITHUB_OUTPUT"

      - name: Cache Electron binary
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: ~/.cache/electron
          key: electron-linux-x64-${{ steps.electron-version.outputs.version }}

      - name: Install dependencies
        env:
          RELAY_SKIP_POCKETBASE_DOWNLOAD: '1'
        run: npm ci --prefer-offline

      - name: Static checks (typecheck + lint + format, parallel)
        run: |
          npm run typecheck & TYPECHECK=$!
          npm run lint & LINT=$!
          npm run format:check & FORMAT=$!
          npm audit --audit-level=high --omit=dev & AUDIT=$!
          wait $TYPECHECK && wait $LINT && wait $FORMAT && wait $AUDIT

      - name: Run tests
        run: npm test

  package-windows:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      RELAY_BUILD_ID: r1-${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Get Electron version
        id: electron-version
        shell: bash
        run: |
          ELECTRON_VER=$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")
          echo "version=$ELECTRON_VER" >> "$GITHUB_OUTPUT"

      - name: Cache Electron binary
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/electron/Cache
            .electron
          key: electron-win-x64-${{ steps.electron-version.outputs.version }}

      - name: Cache electron-builder tooling
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: ~/AppData/Local/electron-builder/Cache
          key: electron-builder-win-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-builder-win-

      - name: Cache Electron headers
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: ~/.electron-gyp
          key: electron-gyp-win-${{ steps.electron-version.outputs.version }}

      - name: Get PocketBase version
        id: pocketbase-version
        shell: bash
        run: |
          PB_VER=$(grep -m1 "const PB_VERSION" scripts/download-pocketbase.mjs | sed "s/.*'\(.*\)'.*/\1/")
          echo "version=$PB_VER" >> "$GITHUB_OUTPUT"

      - name: Cache PocketBase binary
        id: pocketbase-cache
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: resources/pocketbase/win32-x64
          key: pocketbase-win32-x64-${{ steps.pocketbase-version.outputs.version }}

      - name: Install dependencies
        env:
          RELAY_SKIP_POCKETBASE_DOWNLOAD: '1'
        run: npm ci --prefer-offline

      - name: Verify Windows private repair directory ACL
        run: npx vitest run src/main/pocketbase/WindowsPrivateDirectory.windows.test.ts

      - name: Cache rebuilt better-sqlite3
        id: better-sqlite-cache
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: node_modules/better-sqlite3/build/Release
          key: better-sqlite3-electron-win-${{ steps.electron-version.outputs.version }}-${{ hashFiles('package-lock.json') }}

      - name: Install Electron native dependencies
        if: steps.better-sqlite-cache.outputs.cache-hit != 'true'
        run: npx electron-builder install-app-deps --platform=win32 --arch=x64

      - name: Build Relay once
        run: npm run build

      - name: Download PocketBase binary
        if: steps.pocketbase-cache.outputs.cache-hit != 'true'
        run: node scripts/download-pocketbase.mjs --platform=win32 --arch=x64

      - name: Verify PocketBase binary exists
        shell: bash
        run: |
          if [ -f "resources/pocketbase/win32-x64/pocketbase.exe" ]; then
            echo "PocketBase binary found"
            ls -la resources/pocketbase/win32-x64/
          else
            echo "ERROR: PocketBase binary not found!"
            ls -la resources/pocketbase/ 2>/dev/null || echo "resources/pocketbase/ does not exist"
            exit 1
          fi

      - name: Find previous successful Windows artifact
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/find-previous-windows-artifact.ps1
          -Workflow build.yml
          -Branch main
          -CurrentSha "${{ github.sha }}"
          -Destination "$env:RUNNER_TEMP\RelayPrevious.exe"

      - name: Build lightweight previous fixture when no artifact exists
        if: steps.previous.outputs.found != 'true'
        env:
          RELAY_BUILD_ID: ${{ steps.previous.outputs.build_id }}
        run: node scripts/package-windows.mjs --fixture --config.compression=store --config.npmRebuild=false

      - name: Preserve lightweight previous fixture
        if: steps.previous.outputs.found != 'true'
        shell: pwsh
        run: Move-Item -LiteralPath ./release/Relay.exe -Destination "$env:RUNNER_TEMP\RelayPrevious.exe"

      - name: Build and package
        run: node scripts/package-windows.mjs --config.npmRebuild=false

      - name: Smoke test persistent bootstrap
        shell: pwsh
        env:
          RELAY_BOOTSTRAP_SMOKE_CONFIRM: 1
        run: >-
          ./scripts/windows-bootstrap-smoke.ps1
          -Artifact ./release/Relay.exe
          -PreviousArtifact "$env:RUNNER_TEMP\RelayPrevious.exe"
          -ExpectedBuildId "r1-${{ github.sha }}"
          -ExpectedPreviousBuildId "${{ steps.previous.outputs.build_id }}"

      - name: Benchmark packaged startup paths
        shell: pwsh
        env:
          RELAY_BOOTSTRAP_BENCHMARK_CONFIRM: 1
        run: |
          node scripts/benchmark-startup.mjs --scenario prepare --artifact ./release/Relay.exe --compression normal
          node scripts/benchmark-startup.mjs --scenario stable --launcher "$env:LOCALAPPDATA\Relay\Relay.exe" --compression normal --runs 5

      - name: Preserve production artifact for boundary harness
        shell: pwsh
        run: Move-Item -LiteralPath ./release/Relay.exe -Destination "$env:RUNNER_TEMP\RelayProduction.exe"

      - name: Build previous isolated boundary fixture
        env:
          RELAY_BUILD_ID: h0-${{ github.sha }}
          RELAY_BOOTSTRAP_HARNESS: 1
          RELAY_BOOTSTRAP_HARNESS_ROOT: ${{ runner.temp }}\relay-boundary-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/package-windows.mjs --fixture --config.compression=store --config.npmRebuild=false

      - name: Preserve previous isolated boundary fixture
        shell: pwsh
        run: Move-Item -LiteralPath ./release/Relay.exe -Destination "$env:RUNNER_TEMP\RelayBoundaryPrevious.exe"

      - name: Build current isolated boundary fixture
        env:
          RELAY_BUILD_ID: h1-${{ github.sha }}
          RELAY_BOOTSTRAP_HARNESS: 1
          RELAY_BOOTSTRAP_HARNESS_ROOT: ${{ runner.temp }}\relay-boundary-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/package-windows.mjs --fixture --config.compression=store --config.npmRebuild=false

      - name: Exercise isolated activation boundaries and stable fallback
        shell: pwsh
        env:
          RELAY_BOOTSTRAP_BOUNDARY_CONFIRM: 1
        run: >-
          ./scripts/windows-bootstrap-boundary-smoke.ps1
          -Artifact ./release/Relay.exe
          -PreviousArtifact "$env:RUNNER_TEMP\RelayBoundaryPrevious.exe"
          -Root "$env:RUNNER_TEMP\relay-boundary-${{ github.run_id }}-${{ github.run_attempt }}"
          -ExpectedBuildId "h1-${{ github.sha }}"
          -ExpectedPreviousBuildId "h0-${{ github.sha }}"

      - name: Restore production artifact
        shell: pwsh
        run: |
          Remove-Item -LiteralPath ./release/Relay.exe -Force
          Move-Item -LiteralPath "$env:RUNNER_TEMP\RelayProduction.exe" -Destination ./release/Relay.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: relay-windows
          path: release/*.exe

  release:
    needs: [quality, package-windows]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Determine version
        id: version
        uses: actions/github-script@v8
        with:
          script: |
            const version = require('./package.json').version;
            core.setOutput('tag', `v${version}`);
            core.setOutput('name', `Release v${version}`);

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: relay-windows
          path: release/

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: 'Automated release from workflow dispatch.'
          files: |
            release/Relay.exe
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
