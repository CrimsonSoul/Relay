name: Build and Release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Get Electron version
        id: electron-version
        run: |
          ELECTRON_VER=$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")
          echo "version=$ELECTRON_VER" >> "$GITHUB_OUTPUT"

      - name: Cache Electron binary
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: ~/.cache/electron
          key: electron-linux-x64-${{ steps.electron-version.outputs.version }}

      - name: Install dependencies
        env:
          RELAY_SKIP_POCKETBASE_DOWNLOAD: '1'
        run: npm ci --prefer-offline

      - name: Static checks (typecheck + lint + format, parallel)
        run: |
          npm run typecheck & TYPECHECK=$!
          npm run lint & LINT=$!
          npm run format:check & FORMAT=$!
          npm audit --audit-level=high --omit=dev & AUDIT=$!
          wait $TYPECHECK && wait $LINT && wait $FORMAT && wait $AUDIT

      - name: Run tests
        run: npm test

  package-windows:
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/reusable-windows-package.yml
    with:
      artifact-name: relay-windows
      baseline-branch: main
      compression: normal
      publish: never
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: [quality, package-windows]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Determine version
        id: version
        uses: actions/github-script@v8
        with:
          script: |
            const version = require('./package.json').version;
            core.setOutput('tag', `v${version}`);
            core.setOutput('name', `Release v${version}`);

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package-windows.outputs.artifact-name }}
          path: release/

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: 'Automated release from workflow dispatch.'
          files: |
            release/Relay.exe
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
