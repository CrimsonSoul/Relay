sonar.projectKey=CrimsonSoul_Relay
sonar.projectName=Relay
sonar.sourceEncoding=UTF-8

sonar.sources=src,scripts,resources/pocketbase/hooks
sonar.tests=src,scripts,tests
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.test.mjs,src/**/__tests__/**,src/renderer/test/**,dist/**,release/**,coverage/**,test-results/**,playwright-report/**,node_modules/**,docs/**
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/__tests__/**,src/renderer/test/**,scripts/**/*.test.mjs,tests/**/*.ts,tests/**/*.cjs

sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/renderer/lcov.info
sonar.coverage.exclusions=src/main/index.ts,src/main/operations/index.ts,src/renderer/src/main.tsx,src/renderer/src/vite-env.d.ts,src/renderer/src/tabs/notes/index.ts,src/renderer/src/utils/mockData.ts,src/**/__tests__/**,src/renderer/test/**,tests/**,scripts/**,resources/pocketbase/hooks/**,**/*.test.ts,**/*.test.tsx,**/*.test.mjs
sonar.typescript.tsconfigPaths=tsconfig.json,tsconfig.node.json,tsconfig.renderer.json
sonar.scm.provider=git
